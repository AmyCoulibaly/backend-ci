services:
  db:
    image: postgres:15-alpine
    container_name: esante-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-esante_senegal_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-esante_senegal_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - esante-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: esante-senegal-backend:dev
    container_name: esante-backend-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: development
      PORT: "5000"
      GUNICORN_WORKERS: "2"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-esante-senegal}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-key-esante-senegal}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-24}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-esante_senegal_dev}
      CORS_ORIGINS: "*"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - esante-net

volumes:
  pgdata:
    name: esante_pgdata_dev

networks:
  esante-net:
    name: esante_network_dev
    driver: bridge
