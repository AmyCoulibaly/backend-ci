services:
  db:
    image: postgres:15-alpine
    container_name: esante-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-esante_senegal_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-esante_senegal_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - esante-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: esante-senegal-backend:latest
    container_name: esante-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      PORT: 5000
      SECRET_KEY: ${SECRET_KEY:-cle_secrete_production_esante}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cle_jwt_production_esante}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-24}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-esante_senegal_prod}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - esante-net

volumes:
  pgdata:
    name: esante_pgdata

networks:
  esante-net:
    name: esante_network
    driver: bridge
